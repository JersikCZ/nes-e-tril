<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Láďa Jers Nešetřil – Fantasy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0a14;
  }

  .scene {
    position: relative;
    width: 100vw; height: 100vh;
    min-width: 600px;
    overflow: hidden;
  }

  .library-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  /* ── KLIKATELNÉ ZÓNY ── */
  .hotspot {
    position: absolute;
    cursor: pointer;
    text-decoration: none;
  }

  .hotspot::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(212, 168, 90, 0.50) 0%,
      transparent 75%
    );
    opacity: 0;
    transition: opacity 0.35s ease;
    border-radius: inherit;
  }
  .hotspot:hover::after { opacity: 1; }

  .hotspot .tip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 6, 3, 0.88);
    border: 1px solid rgba(212, 168, 90, 0.4);
    color: #d4a85a;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.55rem, 0.9vw, 0.8rem);
    letter-spacing: 0.15em;
    padding: 0.3rem 0.7rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .hotspot:hover .tip { opacity: 1; }

  /* Pozici dveří dolaď pomocí souřadnicového helperu níže */
  #hotspot-door {
    left:   2%;
    bottom: 2%;
    width:  25%;
    height: 50%;
  }

  /* ── SOUŘADNICOVÝ HELPER ── */
  #coords {
    position: fixed;
    bottom: 1rem; right: 2rem;
    background: rgba(0,0,0,0.7);
    color: #d4a85a;
    font-family: monospace;
    font-size: 0.75rem;
    padding: 0.4rem 0.8rem;
    border-radius: 4px;
    pointer-events: none;
    z-index: 100;
    letter-spacing: 0.1em;
  }

  /* ── MOBILNÍ UPOZORNĚNÍ ── */
  .rotate-notice {
    display: none;
    position: fixed; inset: 0;
    background: #0d0a14; z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; color: #c8b882;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.1rem;
    text-align: center; padding: 2rem;
  }
  .rotate-notice .arrow { font-size: 3rem; animation: rotA 2s ease-in-out infinite; }
  @keyframes rotA { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
  @media (max-width:599px) and (orientation:portrait) { .rotate-notice{display:flex;} }
</style>
</head>
<body>

<div class="rotate-notice">
  <div class="arrow">📱</div>
  <div>Otočte prosím telefon<br>na šířku</div>
</div>

<div class="scene" id="scene">

  <img class="library-bg" src="https://i.imgur.com/xud32cf.png" alt="Knihovna">

  <!-- DVEŘE – zpět na rozcestník -->
  <a class="hotspot" id="hotspot-door" href="index.html">
  </a>

</div>

<div id="coords">x: 0% | y: 0%</div>

<script>
  const scene  = document.getElementById('scene');
  const coords = document.getElementById('coords');
  scene.addEventListener('mousemove', e => {
    const r = scene.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
    const y = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
    coords.textContent = `x: ${x}% | y: ${y}%`;
  });
</script>

</body>
</html>
