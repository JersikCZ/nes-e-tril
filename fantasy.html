<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Láďa Jers Nešetřil – Fantasy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0a14;
  }

  .scene {
    position: relative;
    width: 100vw; height: 100vh;
    min-width: 600px;
    overflow: hidden;
  }

  .library-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  /* ── KLIKATELNÉ ZÓNY ── */
  .hotspot {
    position: absolute;
    cursor: pointer;
    text-decoration: none;
  }
  .hotspot::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(212,168,90,0.50) 0%, transparent 75%);
    opacity: 0;
    transition: opacity 0.35s ease;
    border-radius: inherit;
  }
  .hotspot:hover::after { opacity: 1; }
  .hotspot .tip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,6,3,0.88);
    border: 1px solid rgba(212,168,90,0.4);
    color: #d4a85a;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.55rem, 0.9vw, 0.8rem);
    letter-spacing: 0.15em;
    padding: 0.3rem 0.7rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .hotspot:hover .tip { opacity: 1; }

  #hotspot-door {
    left:   2%;
    bottom: 2%;
    width:  25%;
    height: 50%;
  }

  /* ── VZNÁŠEJÍCÍ SE KNÍŽKY ── */
  .book {
    position: absolute;
    cursor: pointer;
    text-decoration: none;
    transform-origin: center center;
    transition: filter 0.3s ease;
  /*  outline: 2px dashed rgba(255,100,100,0.8); */
  }

  .book img {
    width: 140%;
    height: 140%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  .book:hover {
    z-index: 30 !important;
  }
  .book:hover img {
    filter: brightness(1.3) drop-shadow(0 0 22px var(--glow));
  }

  /* Tooltip */
  .book-tip {
    position: absolute;
    bottom: -1.8rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,6,3,0.88);
    border: 1px solid rgba(212,168,90,0.4);
    color: #d4a85a;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.5rem, 0.85vw, 0.72rem);
    letter-spacing: 0.15em;
    padding: 0.25rem 0.6rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    border-radius: 4px;
  }
  .book:hover .book-tip { opacity: 1; }

  /* Animace vznášení */
 @keyframes float1 {
  0%   { transform: translate(0px, -70px)   rotate(var(--tilt)); } /* vrchol 1 – nahoře */
  20%  { transform: translate(57px, 35px)   rotate(calc(var(--tilt) + 15deg)); } /* vrchol 3 – vpravo dole */
  40%  { transform: translate(-50px, -75px) rotate(var(--tilt)); } /* vrchol 5 – vlevo nahoře */
  60%  { transform: translate(60px, -80px)  rotate(calc(var(--tilt) + 30deg)); } /* vrchol 2 – vpravo nahoře */
  80%  { transform: translate(-80px, 25px)  rotate(calc(var(--tilt) + 60deg)); } /* vrchol 4 – vlevo dole */
  100% { transform: translate(0px, -70px)   rotate(var(--tilt)); }
}
@keyframes float2 {
  0%   { transform: translate(00px, -50px)   rotate(calc(var(--tilt) + 30deg)); }
  25%  { transform: translate(-28px, 55px)   rotate(calc(var(--tilt) - 30deg)); }
  50%  { transform: translate(26px, 60px)    rotate(calc(var(--tilt) + 30deg)); }
  75%  { transform: translate(30px, -44px)   rotate(calc(var(--tilt) - 30deg)); }
  85%  { transform: translate(28px, -62px)   rotate(calc(var(--tilt) + 360deg)); }
  100% { transform: translate(0px, -50px)    rotate(var(--tilt)); }
}
@keyframes float3 {
  0%   { transform: translate(60px, 80px)     rotate(var(--tilt)); }
  25%  { transform: translate(70px, -70px)   rotate(calc(var(--tilt) + 30deg)); }
  50%  { transform: translate(-60px, -60px)  rotate(var(--tilt)); }
  75%  { transform: translate(-70px, 55px)    rotate(var(--tilt)); }
  100% { transform: translate(60px, 80px)     rotate(calc(var(--tilt) + 360deg)); }
}
@keyframes float4 {
  0%   { transform: translate(0px, 0px)     rotate(var(--tilt)); }
  6%   { transform: translate(20px, -10px)   rotate(calc(var(--tilt) + 15deg)); }
  12%  { transform: translate(80px, -70px)   rotate(calc(var(--tilt) - 15deg)); }
  18%  { transform: translate(40px, -100px)   rotate(calc(var(--tilt) + 30deg)); }
  25%  { transform: translate(20px, -90px)    rotate(calc(var(--tilt) - 60deg)); }
  31%  { transform: translate(-40px, -100px)  rotate(calc(var(--tilt) + 60deg)); }
  37%  { transform: translate(-80px, -60px)  rotate(calc(var(--tilt) + 15deg)); }
  43%  { transform: translate(-40px, -20px)  rotate(calc(var(--tilt) + 15deg)); }
  50%  { transform: translate(0px, 0px)      rotate(calc(var(--tilt) - 15deg)); }
  56%  { transform: translate(40px, 20px)   rotate(calc(var(--tilt) + 15deg)); }
  62%  { transform: translate(80px, 60px)   rotate(var(--tilt)); }
  68%  { transform: translate(40px, 100px)   rotate(var(--tilt)); }
  75%  { transform: translate(0px, 110px)    rotate(var(--tilt)); }
  81%  { transform: translate(-40px, 100px)   rotate(calc(var(--tilt) + 120deg)); }
  87%  { transform: translate(-80px, 60px)   rotate(calc(var(--tilt) - 150deg)); }
  93%  { transform: translate(-40px, 20px)   rotate(calc(var(--tilt) + 360deg)); }
  100% { transform: translate(0px, 0px)     rotate(var(--tilt)); }
}

  /* ── JEDNOTLIVÉ KNÍŽKY ──
     Pozice dolaď pomocí souřadnicového helperu.
     left/top = střed knížky na ose, width = velikost
  ── */

  /* Raido – Hudba – fialová záře */
  #book-raido {
    --tilt: -10deg;
    --glow: rgba(140, 60, 220, 0.9);
    left: 18%; top:  30%;
    width: clamp(100px, 10vw, 205px);
    aspect-ratio: 1;
    z-index: 10;
    animation: float1 20s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(120, 40, 180, 0.45));
  }

  /* Pertho – D&D – červená záře */
  #book-pertho {
    --tilt: 0deg;
    --glow: rgba(220, 40, 40, 0.9);
    left: 32%;
    top:  20%;
    width: clamp(180px, 12vw, 225px);
    aspect-ratio: 1;
    z-index: 11;
    animation: float2 15.1s ease-in-out infinite;
    animation-delay: 0.6s;
   filter: drop-shadow(0 8px 16px rgba(200,30,30,0.45));
  }

  /* Wunjo – Povídky – oranžová záře */
  #book-wunjo {
    --tilt: -4deg;
    --glow: rgba(255, 120, 20, 0.9);
    left: 53%;
    top:  25%;
    width: clamp(120px, 10vw, 205px);
    aspect-ratio: 1;
    z-index: 12;
    animation: float3 18.6s ease-in-out infinite;
    animation-delay: 0.1s;
    filter: drop-shadow(0 8px 16px rgba(220, 100, 10, 0.45));
  }

  /* Kennaz – Obrázky – bílá záře */
  #book-kennaz {
    --tilt: 0deg;
    --glow: rgba(240, 240, 255, 0.95);
    left: 72%;
    top:  45%;
    width: clamp(120px, 10vw, 205px);
    aspect-ratio: 1;
    z-index: 13;
    animation: float4 28.0s ease-in-out infinite;
    animation-delay: 0.1s;
    filter: drop-shadow(0 8px 20px rgba(200,200,255,0.55));
  }

  /* Hover – zastavení vznášení a zvětšení */
.book:hover {
  animation-play-state: paused;
  transform: scale(2) rotate(var(--tilt)) !important;
  z-index: 30 !important;
}

.book:hover img {
  transition: transform 0.3s ease;
}

  /* ── MOBILNÍ UPOZORNĚNÍ ── */
  .rotate-notice {
    display: none;
    position: fixed; inset: 0;
    background: #0d0a14; z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; color: #c8b882;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.1rem;
    text-align: center; padding: 2rem;
  }
  .rotate-notice .arrow { font-size: 3rem; animation: rotA 2s ease-in-out infinite; }
  @keyframes rotA { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
  @media (max-width:599px) and (orientation:portrait) { .rotate-notice{display:flex;} }

  /* ── DEKORATIVNÍ KNÍŽKY – neklikatelné, menší ── */
  .book-deco {
    position: absolute;
    pointer-events: none;
    transform-origin: center center;
  }
  .book-deco img {
    width: 140%;
    height: 140%;
    object-fit: contain;
    display: block;
  }
  #book-deco1 {
    --tilt: 15deg;
    left: 30%; top: 75%;
    width: clamp(60px, 6vw, 90px);
    aspect-ratio: 1;
    animation: floatD1 18s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(100,60,180,0.3));
  }
  #book-deco2 {
    --tilt: 12deg;
    left: 85%; top: 82%;
    width: clamp(60px, 6vw, 90px);
    aspect-ratio: 1;
    animation: floatD2 14s ease-in-out infinite;
    animation-delay: 1s;
    filter: drop-shadow(0 4px 8px rgba(180,100,20,0.3));
  }

  @keyframes floatD1 {
    0%   { transform: translate(0px, 0px)     rotate(var(--tilt)); }
    33%  { transform: translate(25px, -44px)  rotate(var(--tilt)); }
    66%  { transform: translate(-20px, -30px) rotate(var(--tilt)); }
    100% { transform: translate(0px, 0px)     rotate(var(--tilt)); }
  }
  @keyframes floatD2 {
    0%   { transform: translate(0px, 0px)     rotate(var(--tilt)); }
    25%  { transform: translate(-30px, -25px) rotate(var(--tilt)); }
    50%  { transform: translate(15px, -40px)  rotate(var(--tilt)); }
    75%  { transform: translate(30px, -15px)  rotate(var(--tilt)); }
    100% { transform: translate(0px, 0px)     rotate(var(--tilt)); }
  }


</style>
</head>
<body>

<div class="rotate-notice">
  <div class="arrow">📱</div>
  <div>Otočte prosím telefon<br>na šířku</div>
</div>

<div class="scene" id="scene">

  <img class="library-bg" src="https://i.imgur.com/xud32cf.png" alt="Knihovna">

  <!-- DVEŘE – zpět na rozcestník -->
  <a class="hotspot" id="hotspot-door" href="index.html">
  </a>

  <!-- Raido – Hudba -->
  <a class="book" id="book-raido" href="hudba.html">
    <img src="book_raido.png" alt="Hudba">
    <span class="book-tip">Music</span>
  </a>

  <!-- Pertho – D&D -->
  <a class="book" id="book-pertho" href="dnd.html">
    <img src="book_pertho.png" alt="D&D">
    <span class="book-tip">D&amp;D</span>
  </a>

  <!-- Wunjo – Povídky -->
  <a class="book" id="book-wunjo" href="povidky.html">
    <img src="book_wunjo.png" alt="Povídky">
    <span class="book-tip">Stories</span>
  </a>

  <!-- Kennaz – Obrázky -->
  <a class="book" id="book-kennaz" href="gallery.html">
    <img src="book_kennaz.png" alt="Obrázky">
    <span class="book-tip">Gallery</span>
  </a>

  <!-- Dekorativní knížky – neklikatelné -->
  <div class="book-deco" id="book-deco1">
    <img src="book_fly.png" alt="">
  </div>
  <div class="book-deco" id="book-deco2">
    <img src="book_fly.png" alt="">
  </div>


</div>

<div id="coords">x: 0% | y: 0%</div>

<script>
  const scene  = document.getElementById('scene');
  const coords = document.getElementById('coords');
  scene.addEventListener('mousemove', e => {
    const r = scene.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
    const y = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
    coords.textContent = `x: ${x}% | y: ${y}%`;
  });
</script>

</body>
</html>
