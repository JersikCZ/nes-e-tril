<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Láďa Jers Nešetřil – Fantasy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0a14;
  }

  .scene {
    position: relative;
    width: 100vw; height: 100vh;
    min-width: 600px;
    overflow: hidden;
  }

  /* ── OBRÁZEK KNIHOVNY ── */
  /* Až se rozhodneš, nahraď src cestou k obrázku */
  .library-bg {
    https://imgur.com/undefined
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  /* ── ZPĚT – levý dolní roh ── */
  .back-btn {
    position: absolute;
    bottom: 1.5rem;
    left: 1.5rem;
    z-index: 50;
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    color: rgba(212,168,90,0.75);
    text-decoration: none;
    border: 1px solid rgba(212,168,90,0.3);
    padding: 0.35rem 0.9rem;
    border-radius: 20px;
    background: rgba(10,5,2,0.55);
    backdrop-filter: blur(4px);
    transition: all 0.25s;
  }
  .back-btn:hover {
    color: #d4a85a;
    border-color: rgba(212,168,90,0.7);
    background: rgba(10,5,2,0.75);
  }

  /* ── MOBILNÍ UPOZORNĚNÍ ── */
  .rotate-notice {
    display: none;
    position: fixed; inset: 0;
    background: #0d0a14; z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; color: #c8b882;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.1rem;
    text-align: center; padding: 2rem;
  }
  .rotate-notice .arrow { font-size: 3rem; animation: rotA 2s ease-in-out infinite; }
  @keyframes rotA { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
  @media (max-width:599px) and (orientation:portrait) { .rotate-notice{display:flex;} }
</style>
</head>
<body>

<div class="rotate-notice">
  <div class="arrow">📱</div>
  <div>Otočte prosím telefon<br>na šířku</div>
</div>

<div class="scene">

  <!-- Sem vlož cestu k obrázku knihovny -->
  <img class="library-bg" src="https://imgur.com/a/PwzjaU4" alt="Knihovna">

  <!-- Zpět na rozcestník -->
  <a class="back-btn" href="index.html">← Zpět</a>

</div>

</body>
</html>
