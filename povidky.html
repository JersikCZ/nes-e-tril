<html lang="cs">
<head>
<meta charset="UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
background: black;

  }

  .scene {
    position: relative;
    width: 100vw; height: 100vh;
    min-width: 600px;
    overflow: hidden;
  }

  /* ── VRSTVY ──
     1. černé pozadí (body)
     2. knihy (z-index 10)
     3. rám PNG (z-index 20)
     4. hoverovaná kniha (z-index 30 – přeskočí rám!)
  ── */

  /* Rám – nejvyšší vrstva, PNG s černým pozadím které splyne */
  .shelf-frame {
    position: absolute; inset: 0;
    width: 95%; height: 101%;
    object-fit: contain;
    object-position: center;
    z-index: 20;
    pointer-events: none;
    user-select: none;
    /* Černé pozadí obrázku splyne s černým pozadím stránky */

  }

.shelf-back {
  position: absolute;
  left: 16%; top: 20%;
  width: 63%; height: 68%;
  z-index: 5;
  background: url('wood_back.jpg') repeat;
  background-size: 100px auto;   
  border-radius: 2px; SCHOVANE POZADI /* */
}

  /* ── ZPĚT ── */
  /* ── LAMPY – klikatelné zóny ── */
  .lamp-hotspot {
    position: absolute;
    cursor: pointer;
    text-decoration: none;
    border-radius: 50%;
    z-index: 50;
    transform: translate(-50%, -50%);
  }
  .lamp-hotspot::after {
    content: '';
    position: absolute;
    inset: -120%;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .lamp-hotspot:hover::after { opacity: 1; }

  /* Levá lampa – zlatá záře */
  #lamp-left::after {
    background: radial-gradient(circle, rgba(255,200,50,0.55) 0%, transparent 70%);
  }
  /* Pravá lampa – bílá záře */
  #lamp-right::after {
    background: radial-gradient(circle, rgba(240,240,255,0.55) 0%, transparent 70%);
  }

  .back-btn {
    position: absolute;
    top: 1.2rem; left: 1.2rem;
    z-index: 50;
    font-family: 'Cinzel', serif;
    font-size: 0.65rem; letter-spacing: 0.18em;
    color: rgba(212,168,90,0.75);
    text-decoration: none;
    border: 1px solid rgba(212,168,90,0.3);
    padding: 0.35rem 0.9rem;
    border-radius: 20px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    transition: all 0.25s;
  }
  .back-btn:hover {
    color: #d4a85a;
    border-color: rgba(212,168,90,0.7);
    background: rgba(0,0,0,0.75);
  }

  /* ── JAZYKY ── */
  .lang-btns {
    position: absolute;
    top: 1.2rem; right: 1.2rem;
    z-index: 50;
    display: flex; gap: 6px;
  }
  .lang-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem; letter-spacing: 0.12em;
    border: 1px solid rgba(212,168,90,0.35);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    color: rgba(212,168,90,0.65);
    border-radius: 20px;
    padding: 3px 11px; cursor: pointer; transition: all 0.2s;
  }
  .lang-btn.active, .lang-btn:hover {
    background: rgba(212,168,90,0.75);
    color: #000; border-color: transparent;
  }

  /* ── NADPIS ── */
  .shelf-title {
    position: absolute;
    top: 1.1rem; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    font-family: 'Cinzel', serif;
    color: #e8d5a8;
    font-size: clamp(0.7rem, 1.3vw, 1rem);
    letter-spacing: 0.25em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── POLICE – čtyři oblasti za rámem ── Pozice v procentech odpovídají otvorům v obrázku.  ── */
  .shelf-area {
    position: absolute;
    display: flex;
    align-items: flex-end; /* knihy stojí na spodní liště police */
    justify-content: flex-start;
    gap: 0.5%;
    padding: 0 1%;
    z-index: unset;
/*     outline: 10px dashed rgba(255,100,100,0.4);   ladění */
  }

  /* Horní levá police */
  #shelf-top-left {
    left:   29%;
    top:   25.5%;
    width: 18.5%;
    height: 19%;
  justify-content: flex-end;
  }

  /* Horní pravá police */
  #shelf-top-right {
    left:  47.5%;
    top:   25.5%;
    width: 17.5%;
    height: 19%;
  }

  /* Dolní levá police */
  #shelf-bottom-left {
    left:   29%;
    top:   48%;
    width: 17.5%;
    height: 19%;
  }

  /* Dolní pravá police */
  #shelf-bottom-right {
    left:  47.5%;
    top:   48%;
    width: 18.5%;
    height: 19%;
  }

  /* ── KNIHA ── */
  .book-item {
    position: relative;
    flex-shrink: 0;
    cursor: pointer;
    text-decoration: none;
    /* Výška knihy = 99% výšky police, šířka automatická */
    height: 99%;
    aspect-ratio: 1/4;
    transition: transform 0.3s ease, z-index 0s;
    z-index: 10;
    transform-origin: bottom center;
  }

  .book-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 2px;
    box-shadow: 2px 4px 12px rgba(0,0,0,0.7);
  }

  /* Hover – kniha vyjede nahoru a zvětší se přes rám */
  .book-item:hover {
    transform: translateY(-5%) scale(2.2);
    z-index: 20; /* přeskočí rám! */
  }

  /* Tooltip při hoveru */
  .book-item .book-label {
    position: absolute;
    bottom: -2.2rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.88);
    border: 1px solid rgba(212,168,90,0.4);
    color: #d4a85a;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.45rem, 0.7vw, 0.65rem);
    letter-spacing: 0.1em;
    padding: 0.2rem 0.5rem;
    white-space: pre-line;
    min-width: 8rem;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    border-radius: 4px;
    white-space: pre-line;
  }
  .book-item:hover .book-label { opacity: 1; }

  /* Vlaječka jazyka */
  .book-item .book-flag {
    position: absolute;
    top: 0.2rem; right: 0.2rem;
    font-size: clamp(0.5rem, 0.9vw, 0.8rem);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .book-item:hover .book-flag { opacity: 1; }


  /* ── MOBIL ── */
  .rotate-notice {
    display: none;
    position: fixed; inset: 0;
    background: #000; z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; color: #c8b882;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.1rem;
    text-align: center; padding: 2rem;
  }
  .rotate-notice .arrow { font-size: 3rem; animation: rotA 2s ease-in-out infinite; }
  @keyframes rotA { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
  @media (max-width:599px) and (orientation:portrait) { .rotate-notice{display:flex;} }

  /* ══════════════════════════════════════════════
     OVERLAY – OTEVŘENÁ KNIHA
     Dva režimy:
       .book-overlay            = výběr kapitol
       .book-overlay.reading    = čtení PDF
     ══════════════════════════════════════════════ */
  .book-overlay {
    position: fixed; inset: 0;
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(5px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .book-overlay.visible { opacity: 1; pointer-events: all; }

  /* ── Kniha – základní kontejner ── */
  .open-book {
    position: relative;
    width: min(940px, 90vw);
    height: min(740px, 78vh);
    /* Zlatý rámeček se zlatým vlnkováním */
    border: 6px solid #c8952a;
    border-radius: 6px;
    box-shadow:
      0 0 0 2px #f0d060,
      0 0 0 4px #8b5a10,
      0 25px 60px rgba(0,0,0,0.85);
    background: #f8f0e0;
    display: flex;
    overflow: hidden;
    transition: width 0.55s ease, height 0.55s ease, border-radius 0.55s ease;
  }

  /* Zlaté vlnkování – SVG jako background na border */
  .open-book::before {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 6px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 6px,
      rgba(240,208,80,0.35) 6px, rgba(240,208,80,0.35) 7px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* ── LEVÁ STRÁNKA ── */
  .book-left {
    width: 50%;
    min-width: 50%;
    background: linear-gradient(160deg, #fdfaf3 0%, #f5ecda 100%);
    padding: 2.2rem 1.6rem 2rem;
    display: flex; flex-direction: column; justify-content: center;
    border-right: 1.5px solid #1a1a1a;
    position: relative;
    z-index: 1;
    transition: width 0.55s ease, min-width 0.55s ease, padding 0.55s ease;
    overflow: hidden;
  }
  /* Stínování hřbetu uprostřed */
  .book-left::after {
    content: '';
    position: absolute; top: 0; right: 0; bottom: 0; width: 12px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.08));
    pointer-events: none;
  }

  .book-series {
    font-family: 'Cinzel', serif;
    color: #8b5a10;
    font-size: clamp(0.55rem, 0.85vw, 0.72rem);
    letter-spacing: 0.28em;
    margin-bottom: 0.6rem;
    opacity: 0.75;
  }
  .book-main-title {
    font-family: 'Cinzel', serif;
    color: #2a1200;
    font-size: clamp(0.95rem, 1.8vw, 1.35rem);
    letter-spacing: 0.08em;
    line-height: 1.35;
    margin-bottom: 0.9rem;
  }
  .book-description {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: #5a3a10;
    font-size: clamp(0.72rem, 1vw, 0.88rem);
    line-height: 1.65;
  }
  .book-flag-large { font-size: 1.6rem; margin-top: 1.2rem; }

  /* Tlačítko zpět (skryté v normálním režimu, viditelné při čtení) */
  .btn-back-book {
    display: none;
    margin-top: auto;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem; letter-spacing: 0.15em;
    color: #5a3a10;
    background: none; border: 1px solid rgba(90,58,16,0.35);
    border-radius: 20px; padding: 0.3rem 0.8rem;
    cursor: pointer; transition: all 0.2s;
    align-self: flex-start;
  }
  .btn-back-book:hover { background: rgba(90,58,16,0.08); border-color: rgba(90,58,16,0.7); }

  /* ── PRAVÁ STRÁNKA – seznam kapitol ── */
  .book-right {
    flex: 1;
    background: linear-gradient(160deg, #fdfaf3 0%, #f8f2e4 100%);
    padding: 2rem 1.4rem;
    overflow-y: auto;
    position: relative; z-index: 1;
    transition: flex 0.55s ease, padding 0.55s ease;
  }
  .book-right h3 {
    font-family: 'Cinzel', serif;
    color: #2a1200;
    font-size: clamp(0.58rem, 0.85vw, 0.72rem);
    letter-spacing: 0.22em;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(100,60,0,0.25);
  }
  .chapter-list { list-style: none; }
  .chapter-list li { border-bottom: 1px solid rgba(100,60,0,0.1); }
  .chapter-list a {
    display: block;
    padding: 0.6rem 0.4rem;
    font-family: 'Cormorant Garamond', serif;
    color: #2a1200;
    font-size: clamp(0.82rem, 1.15vw, 0.98rem);
    text-decoration: none;
    transition: all 0.2s;
    line-height: 1.3;
  }
  .chapter-list a:hover {
    color: #7a1a00; padding-left: 0.9rem;
    background: rgba(100,60,0,0.05);
  }
  .chapter-num {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem; color: #9a6820;
    letter-spacing: 0.1em; display: block; margin-bottom: 1px;
  }

  /* ── PDF IFRAME (skrytý do čtecího režimu) ── */
  .book-pdf {
    position: absolute;
    top: 0;
    left: 5%;   /* začíná za levým bokem */
    right: 0;
    bottom: 0;
    width: 95%;
    height: 100%;
    border: none;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease 0.3s;
    z-index: 5;  /* nad vším uvnitř knihy */
    background: #fff;
  }

  /* ── ČTECÍ REŽIM ── */
  .book-overlay.reading .open-book {
    width: 96vw;
    height: 94vh;
    border-radius: 3px;
  }
  .book-overlay.reading .book-left {
    width: 5%;
    min-width: 5%;
    padding: 1rem 0.3rem;
    justify-content: flex-end;
  }
  .book-overlay.reading .book-left .book-series,
  .book-overlay.reading .book-left .book-main-title,
  .book-overlay.reading .book-left .book-description,
  .book-overlay.reading .book-left .book-flag-large { display: none; }
  .book-overlay.reading .book-left .btn-back-book { display: flex; }
  .book-overlay.reading .book-right { flex: 0; width: 0; min-width: 0; padding: 0; overflow: hidden; }
  .book-overlay.reading .book-right h3,
  .book-overlay.reading .book-right .chapter-list { display: none; }
  .book-overlay.reading .book-pdf {
    opacity: 1; pointer-events: all;
  }

  /* Zavírací křížek */
  .book-close {
    position: absolute;
    top: 0.5rem; right: 0.6rem;
    background: none; border: none;
    color: rgba(90,58,16,0.4);
    font-size: 1.1rem; cursor: pointer;
    z-index: 10; transition: color 0.2s;
    font-family: sans-serif;
  }
  .book-close:hover { color: rgba(90,58,16,1); }

  /* Scrollbar */
  .book-right::-webkit-scrollbar { width: 4px; }
  .book-right::-webkit-scrollbar-track { background: rgba(100,60,0,0.08); }
  .book-right::-webkit-scrollbar-thumb { background: rgba(100,60,0,0.25); border-radius: 2px; }

</style>
</head>

    ]

];

const FLAGS = { cs: '🇨🇿', en: '🇬🇧', de: '🇩🇪' };
const SHELVES = {
  tl: document.getElementById('shelf-top-left'),
  tr: document.getElementById('shelf-top-right'),
  bl: document.getElementById('shelf-bottom-left'),
  br: document.getElementById('shelf-bottom-right'),
};

let lang = 'cs';

/* ── OVERLAY LOGIKA ── */
const overlay   = document.getElementById('bookOverlay');
const btnClose  = document.getElementById('bookClose');

function openBookOverlay(book) {
  // Resetovat čtecí režim
  overlay.classList.remove('reading');
  document.getElementById('bookPdf').src = '';

  document.getElementById('bookSeries').textContent    = book.genre.toUpperCase();
  document.getElementById('bookMainTitle').textContent = book.title[lang] || book.title.cs;
  document.getElementById('bookDesc').textContent      = (book.description && book.description[lang]) || '';
  document.getElementById('bookFlag').textContent      = FLAGS[book.lang] || '';

  const label = { cs: 'KAPITOLY', en: 'CHAPTERS', de: 'KAPITEL' };
  document.getElementById('chaptersLabel').textContent = label[lang] || 'KAPITOLY';

  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  (book.chapters || []).forEach((ch, i) => {
    const li  = document.createElement('li');
    const a   = document.createElement('a');
    const num = document.createElement('span');
    num.className = 'chapter-num';
    num.textContent = (i + 1).toString().padStart(2, '0');
    a.appendChild(num);
    a.appendChild(document.createTextNode(ch.title[lang] || ch.title.cs));
    // Klik na kapitolu → čtecí režim s PDF
    a.href = '#';
    a.addEventListener('click', e => {
      e.preventDefault();
      openPdf(ch.file, ch.title[lang] || ch.title.cs);
    });
    li.appendChild(a);
    list.appendChild(li);
  });

  overlay.classList.add('visible');
}

function openPdf(file, title) {
  const iframe = document.getElementById('bookPdf');
  iframe.src = file; // např. 'stories/saly/saly_ch01.pdf'
  // Plynulý přechod do čtecího režimu
  requestAnimationFrame(() => {
    overlay.classList.add('reading');
  });
}

function closeBookOverlay() {
  overlay.classList.remove('visible');
  overlay.classList.remove('reading');
  setTimeout(() => { document.getElementById('bookPdf').src = ''; }, 400);
}

// Zpět z čtení na seznam kapitol
document.getElementById('btnBackBook').addEventListener('click', () => {
  overlay.classList.remove('reading');
  setTimeout(() => { document.getElementById('bookPdf').src = ''; }, 400);
});

btnClose.addEventListener('click', closeBookOverlay);
overlay.addEventListener('click', e => { if (e.target === overlay) closeBookOverlay(); });

function renderBooks() {
  Object.values(SHELVES).forEach(s => s.innerHTML = '');
  BOOKS.forEach(book => {
    const shelf = SHELVES[book.shelf];
    if (!shelf) return;

    const a = document.createElement('a');
    a.className = 'book-item';
    a.href = '#';
    a.addEventListener('click', e => { e.preventDefault(); openBookOverlay(book); });

    const img = document.createElement('img');
    img.src = book.cover;
    img.alt = book.title[lang] || book.title.cs;

    const label = document.createElement('span');
    label.className = 'book-label';
    label.textContent = (book.title[lang] || book.title.cs) + '\n' + (FLAGS[book.lang] || '');

    a.appendChild(img);
    a.appendChild(label);
    shelf.appendChild(a);
  });
}

const TITLES = {
  cs: ' ',
  en: ' ',
  de: ' '
};

function setLang(l) {
  lang = l;
  document.getElementById('shelfTitle').textContent = TITLES[l];
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === l.toUpperCase())
  );
  renderBooks();
}

renderBooks();

/* Souřadnicový helper */
const scene  = document.getElementById('scene');
const coords = document.getElementById('coords');
scene.addEventListener('mousemove', e => {
  const r = scene.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
  const y = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
  coords.textContent = `x: ${x}% | y: ${y}%`;
});
</script>
